apis:
  - name: Statable Stats API
    description: >-
      Read-focused REST HTTP API for privacy-first web analytics. Bearer (stbl_) auth, server-side only (no CORS).
      Endpoints include GET /sites, POST /query, GET /current-visitors, GET /props, GET /funnels, POST
      /funnels/{id}/report, GET /subscription, plus a flagged key-management write surface. Includes a public OpenAPI
      3.1 contract, a hosted MCP server, and an llms.txt.
