    put:
      tags: [Sites]
      operationId: setPublicDashboard
      summary: Publish or unpublish the site's stats
      description: >
        Owner or admin only. `enabled` must be sent explicitly — this is the one setting
        that changes who can SEE the data, so an absent field must not read as
        "turn it off".


        A hobby site on a free account is always public and answers
        `409 hobby_always_public` to `enabled: false`. Its stats are the widget it
        ships, and the hash that addresses them is already in the page's markup;
        `enabled: true` on one succeeds as a no-op. An owner with a paid
        subscription (`active`, or `past_due` during a retried renewal) may turn it off.
