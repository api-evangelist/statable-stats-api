  /sites/{id}/settings/tracking:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Numeric site id.
    get:
      tags: [Sites]
      operationId: getTrackingSettings
      summary: What the installed script collects
      description: >
        Returns the site's effective feature selection plus the full catalogue —
        each entry's state, its dependencies and its marginal brotli cost — so a
        caller can trade capability against script weight without a second call.
        Owner or admin only.
      x-required-scope: sites:write
      responses:
        "200":
          description: The site's tracking settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`insufficient_scope`, `key_not_scoped`, or `not_site_owner`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`write_disabled` or `unknown_site`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [Sites]
      operationId: setTrackingSettings
      summary: Set the tracking feature list
      description: >
        Replaces the selection wholesale. `features` is REQUIRED — an omitted key
        would be indistinguishable from `[]`, which disables everything optional.
        Locked features stay enabled whether or not they are sent, and a feature
        whose `requires` are unmet is rejected. Applying repoints the served
        bundle, then stores the selection, then purges the CDN — the same order
        the dashboard uses. Owner or admin only.
      x-required-scope: sites:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingSettingsRequest"
            examples:
              minimal:
                summary: Only the locked defaults
                value:
                  features: []
              withScroll:
                value:
                  features: ["utm", "engagement", "scroll"]
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingSettings"
        "400":
          description: "`invalid_request` — features omitted, unknown, or a dependency unmet."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`insufficient_scope`, `key_not_scoped`, or `not_site_owner`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`write_disabled` or `unknown_site`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

