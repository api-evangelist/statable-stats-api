# generated: '2026-09-18'
# method: searched
# source: https://statable.com/api/v1/openapi.yaml
openapi: 3.1.0
info:
  title: Statable Stats API
  version: "1.0.0"
  description: >
    Read-only public analytics API for Statable. Authenticate with a bearer API
    key (`Authorization: Bearer stbl_<secret>`). **With no credential at all,
    start at `POST /auth/send-otp` + `POST /auth/verify-otp`** (tag `Bootstrap`,
    `security: []`): they register the account from an emailed code and return
    the first key, so nothing here needs a browser or a dashboard visit. A key
    can also be created by hand in the dashboard under Settings → API. The API
    is **server-side only**: an `stbl_` key is a secret
    and must never be embedded in browser JavaScript, so `/v1` and `/mcp` send no
    CORS headers. Endpoints: `GET /sites` (discover the sites a key can read),
    `POST /query` (run one analytics query), `GET /current-visitors` (realtime),
    `GET /props` (custom-property keys), and saved funnels (`GET /funnels`,
    `POST /funnels/{id}/report`). Analytics data is read-only; the one write
    surface is key management (`/keys*`, scope `keys:manage`), which is behind
    the server-side `API_WRITE_ENABLED` flag and answers 404 `write_disabled`
    while off. Human-readable reference: docs/public-api-v1.md and
    docs/api-v1-write-surface.md.
servers:
  - url: https://statable.com/api/v1
    description: Production
  - url: https://dev.statable.com/api/v1
    description: Development

security:
  - bearerAuth: []

tags:
  - name: Stats
    description: Read analytics data.
  - name: Keys
    description: >
      Manage API keys (write surface). Requires the `keys:manage` scope and the
      server-side `API_WRITE_ENABLED` flag; while the flag is off every route
      here answers 404 `write_disabled`. See docs/api-v1-write-surface.md.
  - name: Sites
    description: >
      Create, change and delete sites (write surface). Requires the
      `sites:write` scope and the server-side `API_WRITE_ENABLED` flag; the
      snippet route needs only `read`. See docs/api-v1-write-surface.md §5.
  - name: Bootstrap
    description: >
      Register an account and obtain its first API key without a browser. The
      only operations in this spec that take NO bearer token. Behind the
      server-side `API_BOOTSTRAP_ENABLED` flag; while it is off both routes
      answer 404 `write_disabled`. See docs/api-v1-write-surface.md §2.

paths:
  /sites:
    get:
      tags: [Stats]
      operationId: listSites
      summary: List the sites this key can read
      description: >
        Returns the sites the authenticating key may read — useful for
        discovering `site_id` values and token introspection. An all-sites key
        returns every accessible site (sorted by name); a single-site key
        returns just its one site (or an empty list if access was removed).
      parameters:
        - name: date_range
          in: query
          required: false
          description: >
            A preset (`7d`/`30d`/`month`/`realtime`) or `Nd` = last N full days,
            N in 1–90 (e.g. `7d`, `14d`) — the same scalar forms POST /query
            accepts (custom `[from,to]` pairs are /query-only). When present, each
            site gains a `stats` block with basic aggregate metrics for the window.
            Omit to keep the list lean (no analytics read). These batch stats are
            NOT per-site-timezone — use POST /query for TZ-exact numbers.
          schema:
            type: string
            pattern: '^(month|realtime|([1-9]|[1-8][0-9]|90)d)$'
            examples: ["7d", "30d"]
      responses:
        "200":
          description: The accessible sites.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

    post:
      tags: [Sites]
      operationId: createSite
      summary: Create a site and get its install snippet
      description: >
        Creates a site and returns everything needed to install tracking, so
        provisioning is one round-trip. Requires an ALL-SITES key: a single-site
        key gets 403 `key_not_scoped`, since the new site would be outside its own
        scope. A duplicate url is 409 `site_exists` — unlike the dashboard, which
        permits it: for an agent a duplicate is nearly always a retry that lost its
        response. The first non-hobby site starts the trial subscription exactly as
        the dashboard does. Send an `Idempotency-Key` to make retries safe.
      x-required-scope: sites:write
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: >
            Replays the stored response for 24 hours instead of creating a second
            site. Reuse with a different body is 409 `idempotency_conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteRequest"
            examples:
              regular:
                value:
                  url: https://example.com
                  timezone: Europe/Kyiv
              hobby:
                summary: Hobby site (domain must match a hobby suffix)
                value:
                  url: https://myproject.github.io
                  hobby: true
      responses:
        "200":
          description: The created site, with its script URL and snippet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDetail"
        "400":
          description: "`invalid_request` — missing url, bad timezone, or a domain not eligible for hobby."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`insufficient_scope` or `key_not_scoped` (a single-site key)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/WriteDisabled"
        "409":
          description: "`site_exists` or `idempotency_conflict`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /query:
    post:
      tags: [Stats]
      operationId: query
      summary: Run one analytics query
      description: >
        One query returns a list of result rows. With no `dimensions` it is an
        aggregate (one row); with one time dimension (`time[:hour|day|week|month]`)
        it is a time series; with one breakdown dimension it is a top-N list plus a
        `meta` pagination block. The response always echoes the resolved request in
        `query` (most usefully `date_range` normalized to concrete `[from,to]`
        dates). At most one dimension per query.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
            examples:
              aggregate:
                summary: Aggregate, last 7 days
                value:
                  site_id: 3093477
                  metrics: ["visitors", "pageviews"]
                  date_range: "7d"
              timeseries:
                summary: Daily series, one country
                value:
                  site_id: 3093477
                  metrics: ["visitors"]
                  date_range: ["2026-06-01", "2026-06-30"]
                  dimensions: ["time:day"]
                  filters:
                    - { field: "country", operator: "is", values: ["US"] }
              breakdown:
                summary: Top 10 countries
                value:
                  site_id: 3093477
                  metrics: ["visitors", "bounce_rate"]
                  date_range: "30d"
                  dimensions: ["visit:country"]
                  limit: 10
      responses:
        "200":
          description: Query result.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /subscription:
    get:
      tags: [Stats]
      operationId: getSubscription
      summary: The account's subscription state
      description: >
        The subscription of the key's owner, in one line's worth of fields:
        enough to say "Trial — N days left", not a billing page. Hobby-only
        accounts have no subscription and answer `status: "none"` with
        `only_hobby: true`.
      x-required-scope: read
      responses:
        "200":
          description: The current subscription state.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                required: [status, is_trial, only_hobby]
                properties:
                  status:
                    type: string
                    enum: [trialing, active, past_due, expired, trial_expired, none]
                  is_trial:
                    type: boolean
                  ends_at:
                    type: string
                    format: date-time
                    description: >
                      When the current state stops being true — the trial's end
                      while trialing, the paid period's end otherwise. Absent
                      when unknown.
                  only_hobby:
                    type: boolean
                    description: True when the account has hobby sites and nothing else.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /current-visitors:
    get:
      tags: [Stats]
      operationId: currentVisitors
      summary: Live count of visitors active in the last 5 minutes
      parameters:
        - name: site_id
          in: query
          required: false
          description: Numeric site id. Optional for a single-site key; required for an all-sites key.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Realtime unique-visitor count.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                properties:
                  site_id: { type: integer, format: int64 }
                  visitors: { type: integer, format: int64 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /props:
    get:
      tags: [Stats]
      operationId: listPropKeys
      summary: List a site's custom-property keys
      description: >
        The custom-property keys a site has recorded (each paired with the event
        it was sent with) — discovery for the event:props:<key> breakdown. Returns
        the full set (no pagination) for the window.
      parameters:
        - name: site_id
          in: query
          required: false
          description: Numeric site id. Optional for a single-site key; required for an all-sites key.
          schema:
            type: integer
            format: int64
        - name: date_range
          in: query
          required: false
          description: >
            Same forms as /query (default 30d): a preset `7d`/`30d`/`month`, or a
            URL-encoded custom pair `["YYYY-MM-DD","YYYY-MM-DD"]`.
          schema:
            type: string
      responses:
        "200":
          description: The site's custom-property keys.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                properties:
                  props:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        event: { type: string }
                        count: { type: integer, format: int64 }
                        first_seen: { type: string, format: date-time }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /funnels:
    get:
      tags: [Stats]
      operationId: listFunnels
      summary: List a site's configured conversion funnels
      description: >
        Returns the site's saved funnel definitions (managed in the dashboard).
        Use a funnel `id` with POST /funnels/{id}/report. Funnels are read-only
        over the API — this endpoint does not create or edit them.
      parameters:
        - name: site_id
          in: query
          required: false
          description: Numeric site id. Optional for a single-site key (defaults to its site); required for an all-sites key.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The site's funnel definitions.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                required: [funnels]
                properties:
                  funnels:
                    type: array
                    items:
                      $ref: "#/components/schemas/FunnelDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /funnels/{id}/report:
    post:
      tags: [Stats]
      operationId: runFunnelReport
      summary: Run a saved funnel and return per-step conversions
      description: >
        Runs a saved funnel over a date range (+ optional segment filters) and
        returns an ORDERED per-step result with top-level scalars — a bespoke,
        non-tabular shape (funnel output is not rows). `steps` must not be sorted;
        `conversion_rate` is cumulative versus the first step (`entering`), not
        step-to-step. The intra-conversion window is a fixed 1 day, independent of
        `date_range` (which only bounds the sessions scanned).
      parameters:
        - name: id
          in: path
          required: true
          description: Funnel id (from GET /funnels).
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FunnelReportRequest"
            examples:
              basic:
                summary: Last 30 days
                value:
                  site_id: 3093477
                  date_range: "30d"
              segmented:
                summary: Segmented by country
                value:
                  site_id: 3093477
                  date_range: ["2026-06-01", "2026-06-30"]
                  filters:
                    - { field: "country", operator: "is", values: ["DE"] }
      responses:
        "200":
          description: The funnel result.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunnelReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /auth/send-otp:
    post:
      tags: [Bootstrap]
      operationId: bootstrapSendOTP
      summary: Email a one-time code
      description: >
        Sends a 6-digit code to the address, valid for a short window and usable
        once. Takes no credential — this is the entry point for a client that has
        none. Rate limited per email (2/minute), per IP (5/hour) and per IP across
        the whole bootstrap branch (20/hour). The response is identical whether or
        not the address already has an account, so it cannot be used to test for
        one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapSendOTPRequest"
            examples:
              default:
                value:
                  email: agent@yourcompany.com
      responses:
        "200":
          description: The code was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapSendOTPResponse"
        "400":
          description: >
            `invalid_request` — a valid email is required. `email_undeliverable` — the
            address can never receive mail (a reserved domain such as example.com, or a
            non-ASCII mailbox no provider accepts), so no code is generated and nothing
            is sent. `domain_not_allowed` — the address sits in a zone we do not serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/WriteDisabled"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /auth/verify-otp:
    post:
      tags: [Bootstrap]
      operationId: bootstrapVerifyOTP
      summary: Consume the code and receive the first API key
      description: >
        Verifies the code, creates the account if the address is new, records the
        terms acceptance, and returns a freshly minted key — the raw token EXACTLY
        ONCE. `accept_terms` must be true. Requested `scopes` must be within
        `API_BOOTSTRAP_SCOPES` (default `read,sites:write`); omitting them yields
        that whole set, and `billing:write` is never obtainable here. Everything
        that can be rejected without the code is validated first, so a bad field
        does not burn a valid code. The key is always all-sites and always expires
        (90 days by default, 365 max).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapVerifyOTPRequest"
            examples:
              provisioning:
                summary: Register and get a key that can create sites
                value:
                  email: agent@yourcompany.com
                  code: "123456"
                  accept_terms: true
                  key_name: provisioning bot
              readOnly:
                summary: Read-only key, 30 days
                value:
                  email: agent@yourcompany.com
                  code: "123456"
                  accept_terms: true
                  scopes: ["read"]
                  expires_in_days: 30
      responses:
        "200":
          description: The account and its first key, including the one-time token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapVerifyOTPResponse"
        "400":
          description: >
            `terms_not_accepted` (accept_terms was not true — no account is
            created), `invalid_request`, `invalid_scope` (outside the bootstrap
            allowlist), `invalid_expiry`, or `key_limit_reached` (an existing
            account already holds 10 active keys).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "`otp_invalid` — the code is wrong, expired, or already used."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/WriteDisabled"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /sites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Numeric site id.
    patch:
      tags: [Sites]
      operationId: updateSite
      summary: Change a site's url, timezone or week start
      description: >
        Owner or admin only — a member gets 403 `not_site_owner`. Omitted
        fields are left alone. Unlike the read surface there is no tracking-active
        gate: a lapsed account must still be able to fix and clean up its sites.
        Another account's id answers 404 `unknown_site`, exactly as a nonexistent
        one.
      x-required-scope: sites:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteRequest"
            examples:
              timezone:
                value:
                  timezone: UTC
                  week_start: 0
      responses:
        "200":
          description: The updated site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDetail"
        "400":
          description: "`invalid_request` — bad url, timezone or week_start."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`insufficient_scope`, `key_not_scoped`, or `not_site_owner`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`write_disabled` or `unknown_site`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`site_exists` — the account already uses that url."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [Sites]
      operationId: deleteSite
      summary: Delete a site
      description: >
        Owner only — an admin may edit the site but not delete it — and it
        really deletes: the site plus its goals, hostnames, blocklists and import
        jobs, with its ClickHouse data removed asynchronously. An admin or a
        member gets 403 `not_site_owner` — there is no API
        equivalent of the dashboard's "remove my access".
      x-required-scope: sites:write
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`insufficient_scope`, `key_not_scoped`, or `not_site_owner`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`write_disabled` or `unknown_site`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /sites/{id}/snippet:
    get:
      tags: [Sites]
      operationId: getSiteSnippet
      summary: The install tag for a site
      description: >
        Returns the script URL and the ready-to-paste tag. Scope `read`, not
        `sites:write`: the snippet is public information (it ends up in the page
        source), and shared users may install tracking too. `type` selects a
        widget instead of the tracker: a hobby site gets the bundled `/t/` build,
        which counts as well as draws, a paid site the widget-only build — its
        counting is the tracker tag it installs separately.
      x-required-scope: read
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [globe, live-users, map, countries]
          description: Omit for the tracking script.
      responses:
        "200":
          description: The install URL and snippet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSnippet"
        "400":
          description: "`invalid_request` — unknown snippet type."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
