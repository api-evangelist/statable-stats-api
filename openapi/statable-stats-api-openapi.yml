  /keys:
    get:
      tags: [Keys]
      operationId: listApiKeys
      summary: List the account's active API keys
      description: >
        Returns the owner's active (non-revoked) keys, newest first. No token or
        hash is ever returned here — the raw token exists only in the create and
        rotate responses.
      x-required-scope: keys:manage
      responses:
        "200":
          description: The account's active keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KeysForbidden"
        "404":
          $ref: "#/components/responses/WriteDisabled"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [Keys]
      operationId: createApiKey
      summary: Create an API key
      description: >
        Mints a key and returns its raw token EXACTLY ONCE. The requested scopes
        must be a subset of the authenticating key's scopes (else 403
        `scope_escalation`), and a single-site key may only create keys locked to
        its own site (else 403 `key_not_scoped`). `expires_in_days` defaults to 90
        and is capped at 365 — unlike the dashboard, the API cannot mint a key
        that never expires. Max 10 active keys per account.
      x-required-scope: keys:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
            examples:
              readOnly:
                summary: Read-only key, default 90-day expiry
                value:
                  name: reporting job
                  scopes: ["read"]
              singleSite:
                summary: Key locked to one site, 30 days
                value:
                  name: site bot
                  scopes: ["read"]
                  website_id: 3093477
                  expires_in_days: 30
      responses:
        "200":
          description: The created key, including the one-time raw token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIKey"
        "400":
          $ref: "#/components/responses/KeysBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KeysForbidden"
        "404":
          description: >
            `write_disabled` (the write surface is off) or `unknown_site`
            (`website_id` does not exist or the owner cannot reach it —
            deliberately indistinguishable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /keys/{id}:
    delete:
      tags: [Keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: >
        Revokes the key; its token stops authenticating immediately. A key cannot
        revoke itself (409 `self_modification`).
      x-required-scope: keys:manage
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KeysForbidden"
        "404":
          $ref: "#/components/responses/KeyNotFound"
        "409":
          $ref: "#/components/responses/SelfModification"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /keys/{id}/rotate:
    post:
      tags: [Keys]
      operationId: rotateApiKey
      summary: Issue a fresh secret for an API key
      description: >
        Replaces the key's secret in place — same id, name, site scope, scopes and
        expiry — and invalidates the old token immediately. The new token is
        returned exactly once. No request body. A key cannot rotate itself (409
        `self_modification`).
      x-required-scope: keys:manage
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "200":
          description: The rotated key, including the one-time raw token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KeysForbidden"
        "404":
          $ref: "#/components/responses/KeyNotFound"
        "409":
          $ref: "#/components/responses/SelfModification"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /keys/{id}/events:
    get:
      tags: [Keys]
      operationId: listApiKeyEvents
      summary: The key's lifecycle audit trail
      description: >
        Returns the key's create / rotate / revoke events, newest first (revoked
        keys keep their trail). `actor_key_id` names the API key that performed
        the action, or null when it was done from the dashboard.
      x-required-scope: keys:manage
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "200":
          description: The key's audit trail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyEventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KeysForbidden"
        "404":
          $ref: "#/components/responses/KeyNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

components:
  parameters:
    ApiKeyId:
      name: id
      in: path
      required: true
      description: Numeric API key id (from GET /keys).
      schema:
        type: integer
        format: int64

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: stbl_<secret>
      description: >
        A key minted in Settings → API. All tokens start with `stbl_`. Missing,
        malformed, invalid, expired, or revoked → 401. Every operation in this
        spec requires the key's `read` scope; without it → 403
        `insufficient_scope`.

  headers:
    X-Request-ID:
      description: >
        Correlation id for support, present on every response including
        successful ones. The leading segment names the node that served the
        request, so this one value is enough to locate the log entry. Error
        bodies repeat it as `request_id`. A client-supplied X-Request-ID is
        recorded server-side but never echoed back in place of ours.
      schema:
        type: string
        example: ch-node01-01997f2a8b3c7d5e8f01abcdef123456
    X-RateLimit-Limit:
      description: The per-key hourly rate limit for your plan.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests left in the current per-key window.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Seconds until the per-key window resets (delta-seconds, not an epoch).
      schema:
        type: integer

  responses:
    BadRequest:
      description: >
        Invalid request. Branch on the stable `code`: invalid_request,
        metrics_required, unknown_metric, too_many_dimensions, unknown_dimension,
        invalid_date_range, invalid_interval, metric_not_available, invalid_filter,
        event_filter_required, invalid_compare, compare_length_mismatch,
        site_id_required, limit_offset_misuse.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing/malformed/invalid/expired/revoked bearer token (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        `insufficient_scope` (the key lacks the `read` scope every endpoint here
        requires), `key_not_scoped` (single-site key asked for a different site)
        or `tracking_inactive` (the site's tracking has stopped).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >
        `unknown_site` — the `site_id` does not exist OR the key's owner has no
        access. Deliberately indistinguishable (same status AND code) so a key
        cannot enumerate which site_ids exist. `unknown_funnel` (funnel endpoints
        only) — the funnel id is not found for the resolved site.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: >
        Hourly account (default 2000/h) or per-key (default 600/h) limit hit
        (`rate_limited`). Retry after the `Retry-After` seconds. The X-RateLimit-*
        headers report the window that tripped (account on an account limit).
      headers:
        Retry-After:
          description: Seconds until you may retry.
          schema:
            type: integer
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: >
        Unexpected server error (`internal`). Report it with the `request_id`
        from the body or the X-Request-ID header: it is what lets the exact log
        entry be found, and without it a 500 can only be matched by guessing at a
        time window.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    KeysBadRequest:
      description: >
        Invalid request. Branch on the stable `code`: invalid_request (malformed
        body or a name outside 1–100 characters), invalid_scope (scope not in the
        vocabulary), invalid_expiry (expires_in_days outside 1–365),
        key_limit_reached (10 active keys already).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    KeysForbidden:
      description: >
        `insufficient_scope` (the key lacks `keys:manage`), `scope_escalation`
        (requested scopes exceed the authenticating key's scopes) or
        `key_not_scoped` (a single-site key tried to widen its site scope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    KeyNotFound:
      description: >
        `api_key_not_found` — unknown, already revoked, or another account's key
        id (deliberately indistinguishable). Or `write_disabled` when the write
        surface is off.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SiteBadRequest:
      description: "`invalid_request` — the body or a field is not acceptable."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    SiteForbidden:
      description: "`insufficient_scope`, `key_not_scoped`, or `not_site_owner`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    SiteNotFound:
      description: "`write_disabled` or `unknown_site`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    WriteDisabled:
      description: >
        `write_disabled` — the write surface is off (`API_WRITE_ENABLED=false`).
        404 rather than 403 so a disabled surface is not advertised.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SelfModification:
      description: >
        `self_modification` — a key may not rotate or revoke itself, so an agent
        cannot destroy the credential it is mid-flow with.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Metric:
      type: string
      description: >
        `visits` = sessions. `visit_duration` in seconds. `bounce_rate` is a
        0–100 percentage. `views_per_visit` = pageviews/visits (2 decimals).
        `engagement_time` = avg active-engagement seconds (aggregate + time-series,
        distinct from visit_duration). `events` = raw event count (breakdowns
        event:name/props/goal). `conversion_rate` = converters percent (event:goal).
        `time_on_page`/`scroll_depth` = avg seconds / avg max scroll% 0-100
        (event:page, event:folder). `exit_rate` = exits percent of pageviews
        (visit:exit_page). The last five are breakdown-only: off their dimension,
        and on an aggregate or a time series, they return `metric_not_available`
        naming the shape and the dimensions that do compute them.
        `unknown_metric` means the name itself is not a metric we compute.
      enum:
        - visitors
        - pageviews
        - visits
        - visit_duration
        - bounce_rate
        - views_per_visit
        - engagement_time
        - events
        - conversion_rate
        - time_on_page
        - scroll_depth
        - exit_rate

    Dimension:
      type: string
      description: >
        At most one per query. A time dimension yields a series; a breakdown
        dimension yields top-N rows. Not every metric is valid for every
        breakdown — a metric the builder does not compute returns
        `metric_not_available`. In addition to the enum below, a dynamic
        `event:props:<key>` dimension breaks a custom event down by one of its
        property values (metrics `visitors` + `events`); it requires an `event`
        filter to name the event, else `event_filter_required`.
      enum:
        - time
        - time:minute
        - time:hour
        - time:day
        - time:week
        - time:month
        - visit:source
        - visit:referrer
        - visit:channel
        - visit:utm_source
        - visit:utm_medium
        - visit:utm_campaign
        - visit:utm_content
        - visit:utm_term
        - visit:country
        - visit:region
        - visit:city
        - visit:browser
        - visit:browser_version
        - visit:os
        - visit:os_version
        - visit:device
        - visit:entry_page
        - visit:exit_page
        - event:page
        - event:folder
        - event:hostname
        - event:name
        - event:goal
        - event:status_code

    DateRange:
      description: >
        A scalar string — a preset (`7d`/`30d` = last N full days; `month` =
        current calendar month to date; `realtime` = last ~30 min) or a bare
        `Nd` for the last N days, N in 1–90 (e.g. `14d`) — OR a custom inclusive
        `[from, to]` pair of `YYYY-MM-DD` dates with `from <= to` and a span of
        at most 366 days. The scalar forms are exactly what `GET /sites` accepts;
        for a window over 90 days use a custom pair.
      oneOf:
        - type: string
          pattern: '^(month|realtime|([1-9]|[1-8][0-9]|90)d)$'
        - type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
            format: date
      examples:
        - "7d"
        - "14d"
        - ["2026-06-01", "2026-06-30"]

    Filter:
      type: object
      additionalProperties: false
      required: [field, operator, values]
      properties:
        field:
          type: string
          description: >
            Field name WITHOUT the visit:/event: prefix. Geo fields take codes,
            not names (country/region = ISO/subdivision codes, city = numeric
            geoname_id — the values geo breakdowns return). The `event` field
            filters by a custom event name (an `event:name` breakdown value) and
            restricts the whole query to that event's sessions; it accepts ONLY
            operator `is` with a single non-standard value (not `pageview` /
            `engagement`) — other forms return `invalid_filter`.
          enum:
            - browser
            - browser_version
            - os
            - os_version
            - device
            - country
            - city
            - region
            - hostname
            - utm_source
            - utm_medium
            - utm_campaign
            - utm_content
            - utm_term
            - entry_page
            - exit_page
            - source
            - channel
            - referrer
            - page
            - code
            - event
        operator:
          type: string
          enum: [is, is_not, contains, does_not_contain]
        values:
          type: array
          minItems: 1
          description: OR-ed together. A value may not contain a comma.
          items:
            type: string

    QueryRequest:
      type: object
      additionalProperties: false
      required: [metrics, date_range]
      properties:
        site_id:
          type: integer
          format: int64
          description: >
            Required for an all-sites key; optional for a single-site key
            (defaults to the key's site). Omitting it on an all-sites key →
            `site_id_required`.
        metrics:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Metric"
        date_range:
          $ref: "#/components/schemas/DateRange"
        dimensions:
          type: array
          maxItems: 1
          description: Zero or one element. Omit / empty = aggregate.
          items:
            $ref: "#/components/schemas/Dimension"
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Filter"
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: Breakdown queries only. Clamped to 1–1000. Sending it on an aggregate or time-series query → `limit_offset_misuse`.
        offset:
          type: integer
          minimum: 0
          default: 0
          description: Breakdown queries only. Sending it on an aggregate or time-series query → `limit_offset_misuse`.
        compare:
          description: >
            `"previous_period"` (equal-length window before date_range) or a
            custom `["YYYY-MM-DD","YYYY-MM-DD"]` pair. Adds a `compare`
            {value, change%} block — per metric (aggregate), per row (breakdown,
            each row's true previous value; not on event:status_code/event:goal),
            or per bucket (time-series) — plus `compare_date_range` to the query
            echo. The compare range must be the same length as date_range
            (`previous_period` always is) → an unequal custom pair yields
            `compare_length_mismatch`.
          oneOf:
            - type: string
              enum: [previous_period]
            - type: array
              minItems: 2
              maxItems: 2
              items: { type: string, format: date }

    ResultRow:
      type: object
      properties:
        dimensions:
          type: object
          description: >
            Absent for aggregate queries. Keyed by the requested dimension
            string. For geo breakdowns the value is the round-trip code
            (visit:country → ISO alpha-2, visit:region → subdivision code,
            visit:city → numeric geoname_id) — exactly what the matching filter
            accepts.
          additionalProperties:
            type: string
        labels:
          type: object
          description: >
            Present only on geo breakdowns — the human-readable display name for
            the code in `dimensions`, keyed by the same dimension.
          additionalProperties:
            type: string
        metrics:
          type: object
          description: The requested metrics for this row.
          additionalProperties:
            type: number
        compare:
          type: object
          description: >
            Present only when the request set `compare`. Keyed by metric →
            {value, change}: the metric's value in the compare window and the
            percent change vs it. Not emitted on event:status_code / event:goal.
          additionalProperties:
            type: object
            properties:
              value: { type: number }
              change: { type: number }

    Meta:
      type: object
      description: Present only on breakdown responses.
      properties:
        total:
          type: integer
          description: Total distinct values for the window, across all pages.
        limit:
          type: integer
          description: Effective limit after clamping.
        offset:
          type: integer
        has_more:
          type: boolean
          description: True when offset + returned rows < total. Page again with offset += limit.

    QueryEcho:
      type: object
      description: Echo of the resolved request.
      properties:
        site_id:
          type: integer
          format: int64
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        date_range:
          type: array
          description: Always the resolved concrete [from, to] YYYY-MM-DD window (presets normalized).
          minItems: 2
          maxItems: 2
          items:
            type: string
            format: date
        compare_date_range:
          type: array
          description: Present only when `compare` was set — the resolved [from, to] of the compare window.
          minItems: 2
          maxItems: 2
          items:
            type: string
            format: date
        dimensions:
          type: array
          items:
            $ref: "#/components/schemas/Dimension"
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Filter"

    QueryResponse:
      type: object
      required: [results, query]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ResultRow"
        meta:
          $ref: "#/components/schemas/Meta"
        query:
          $ref: "#/components/schemas/QueryEcho"
        has_import:
          type: boolean
          description: True when the site has imported (e.g. GA4) data overlapping the queried window.

    SiteStats:
      type: object
      properties:
        date_range:
          type: string
        metrics:
          type: object
          additionalProperties:
            type: number

    SiteSummary:
      type: object
      required: [site_id, name, hash, timezone, hobby]
      properties:
        site_id:
          type: integer
          format: int64
          description: The numeric id you pass as `site_id` to /query.
        name:
          type: string
          description: >
            The site's domain. For the configured public demo site this is
            masked to `example.com` — see "The demo site is masked" in
            docs/public-api-v1.md; breakdown values carrying the host are
            masked the same way.
        hash:
          type: string
          description: >
            The site's public token, used by widget script URLs and the shared
            dashboard link. Integrations need it and previously had to parse it
            out of a widget snippet URL — which only worked for hobby sites,
            since a paid site's tracker URL is keyed by the numeric id.
        timezone:
          type: string
          description: The site's reporting timezone.
        hobby:
          type: boolean
          description: >
            True for a site on the free plan. It decides how the site counts at
            all: a hobby site is tracked by the bundled `/t/` build (widget plus
            counter) carrying a `data-id` attribute, and an event reaching us
            from any other build is refused. Install `GET /sites/{id}/snippet`
            verbatim and this is handled for you; branch on it only if you build
            the tag yourself.
        stats_start_date:
          type: [string, "null"]
          format: date
          description: Stored value only (not computed on the fly); null if not yet computed.
        created_at:
          type: string
          format: date-time
        stats:
          $ref: "#/components/schemas/SiteStats"

    SitesResponse:
      type: object
      required: [sites]
      properties:
        sites:
          type: array
          items:
            $ref: "#/components/schemas/SiteSummary"

    Error:
      type: object
      required: [error, code]
      properties:
        hint:
          type: string
          description: >
            One sentence on what to do next. Present only on the errors a client
            meets while exploring (`not_found`, `method_not_allowed`); other
            errors omit it. Human-readable — do not branch on it.
          example: "Use one of: GET, POST."
        docs:
          type: string
          format: uri
          description: >
            Where to read more. Present together with `hint`, omitted otherwise.
          example: https://statable.com/api/v1/openapi.yaml
        request_id:
          type: string
          description: >
            Same value as the X-Request-ID response header, repeated here because
            clients log bodies more often than headers. Quote it in a support
            request. Present on every error, including the `not_found` and
            `method_not_allowed` answers for a path or method that has no
            route.
          example: ch-node01-01997f2a8b3c7d5e8f01abcdef123456
        error:
          type: string
          description: Human-readable detail. May be reworded — do not branch on it.
        code:
          type: string
          description: >
            Stable machine-readable slug (contract — never changes). The
            `ambiguous_domain` code is emitted only by the MCP tools (when a
            `site` domain matches more than one stored site), not by /query.
          enum:
            - invalid_request
            - metrics_required
            - unknown_metric
            - too_many_dimensions
            - unknown_dimension
            - invalid_date_range
            - invalid_interval
            - metric_not_available
            - invalid_filter
            - event_filter_required
            - invalid_compare
            - compare_length_mismatch
            - site_id_required
            - limit_offset_misuse
            - unauthorized
            - insufficient_scope
            - key_not_scoped
            - tracking_inactive
            - unknown_site
            - unknown_funnel
            - rate_limited
            - internal
            - ambiguous_domain
            - invalid_scope
            - scope_escalation
            - invalid_expiry
            - key_limit_reached
            - api_key_not_found
            - self_modification
            - write_disabled
            - terms_not_accepted
            - otp_invalid
            - site_exists
            - domain_not_allowed
            - email_undeliverable
            - not_site_owner
            - idempotency_conflict
            - goal_exists
            - goal_not_found
            - funnel_exists
            - hobby_always_public
            - not_found
            - method_not_allowed

    APIKey:
      type: object
      description: >
        The non-secret view of a key. The raw token is never stored and never
        appears here — only in the create/rotate responses.
      required: [id, name, prefix, website_id, scopes, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        prefix:
          type: string
          description: Non-secret fragment of the token, to identify the key in a list.
          examples: ["stbl_A1b2C3d4"]
        website_id:
          type: [integer, "null"]
          format: int64
          description: The site the key is locked to; null = all of the owner's sites.
        scopes:
          type: string
          description: Comma-separated scope set, in catalog order.
          examples: ["read", "read,keys:manage"]
        created_at:
          type: string
          format: date-time
        created_ip:
          type: [string, "null"]
        last_used_at:
          type: [string, "null"]
          format: date-time
        last_used_ip:
          type: [string, "null"]
        expires_at:
          type: [string, "null"]
          format: date-time
          description: >
            null = never expires. Only dashboard-created keys can be
            non-expiring; keys created over the API always carry an expiry.

    HostnameListRequest:
      type: object
      description: Replaces both lists. Send [] to clear one.
      properties:
        allowed:
          type: array
          items:
            type: string
        blocked:
          type: array
          items:
            type: string

    HostnameList:
      type: object
      description: The stored lists, as GET returns them. Both keys are always present; an empty list is [].
      required: [allowed, blocked]
      properties:
        allowed:
          type: array
          items:
            type: string
        blocked:
          type: array
          items:
            type: string

    CountryListRequest:
      type: object
      description: ISO 3166-1 alpha-2 codes. Replaces both lists.
      properties:
        allowed:
          type: array
          items:
            type: string
        blocked:
          type: array
          items:
            type: string

    CountryList:
      type: object
      description: >
        The stored lists, as GET returns them. Note the deliberate asymmetry with
        the PUT body: writes take bare ISO codes, reads return one entry per
        country with the time it was added. Both keys are always present; an empty
        list is [].
      required: [allowed, blocked]
      properties:
        allowed:
          type: array
          items:
            $ref: "#/components/schemas/CountryEntry"
        blocked:
          type: array
          items:
            $ref: "#/components/schemas/CountryEntry"

    CountryEntry:
      type: object
      required: [code, created_at]
      properties:
        code:
          type: string
          description: ISO 3166-1 alpha-2.
          example: DE
        created_at:
          type: string
          format: date-time
          description: When the country was added to the list.

    SettingsCount:
      type: object
      required: [site_id, count]
      properties:
        site_id:
          type: integer
          format: int64
        count:
          type: integer
          description: Entries stored after the replace.

    PublicDashboard:
      type: object
      required: [enabled]
      properties:
        site_id:
          type: integer
          format: int64
          readOnly: true
        enabled:
          type: boolean

    GoalRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        path:
          type: string
          description: URL path to match.
        operator:
          type: string
          enum: [e, b, c]
          default: e
          description: e = equals, b = begins with, c = contains.
        event_name:
          type: string
          description: Match a custom event instead of a path.
        scroll_depth:
          type: integer
          description: Percent scrolled.

    Goal:
      type: object
      required: [id, host_id, name]
      properties:
        id:
          type: integer
          format: int64
        host_id:
          type: integer
          format: int64
        name:
          type: string
        path:
          type: string
        operator:
          type: string
        event_name:
          type: string
        scroll_depth:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FunnelRequest:
      type: object
      required: [name, steps]
      properties:
        name:
          type: string
        steps:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/FunnelStep"
        scope:
          type: string
          enum: [visitor, session]
          default: visitor
        strict_order:
          type: boolean


    TrackingSettingsRequest:
      type: object
      required: [features]
      properties:
        features:
          type: array
          description: >
            The complete desired selection. Send [] to keep only the locked
            defaults. Omitting the key is an error, not "unchanged".
          items:
            type: string

    TrackingFeatureState:
      type: object
      required: [id, label, enabled, locked, default, size_br]
      properties:
        id:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        locked:
          type: boolean
          description: Always collected; cannot be turned off.
        default:
          type: boolean
        requires:
          type: array
          items:
            type: string
          description: Feature ids that must also be enabled.
        size_br:
          type: integer
          description: Marginal cost in bytes, brotli-compressed.

    TrackingSettings:
      type: object
      required: [site_id, version, bundle, enabled, features]
      properties:
        site_id:
          type: integer
          format: int64
        version:
          type: integer
          description: Catalogue version.
        bundle:
          type: string
          description: The build actually served for this site.
        enabled:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            $ref: "#/components/schemas/TrackingFeatureState"

    CreateSiteRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          examples: ["https://example.com"]
        timezone:
          type: string
          description: IANA zone. Omitted = the server default.
          examples: ["Europe/Kyiv"]
        hobby:
          type: boolean
          default: false
          description: >
            Request a hobby site. The domain must match a configured hobby suffix.

    UpdateSiteRequest:
      type: object
      description: Omitted fields are left unchanged.
      properties:
        url:
          type: string
          description: Must start with http:// or https://.
        timezone:
          type: string
        week_start:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday.

    SiteDetail:
      type: object
      required: [site_id, name, hash, timezone, week_start, hobby, script_url, snippet]
      properties:
        site_id:
          type: integer
          format: int64
        name:
          type: string
          description: The site url as stored.
        hash:
          type: string
          description: Same token as in SiteSummary.hash.
        timezone:
          type: string
        week_start:
          type: integer
        hobby:
          type: boolean
        script_url:
          type: string
        snippet:
          type: string
          description: The ready-to-paste script tag.

    SiteSnippet:
      type: object
      required: [site_id, script_url, snippet]
      properties:
        site_id:
          type: integer
          format: int64
        script_url:
          type: string
        snippet:
          type: string
          description: >
            The tag to paste, ready as it stands — install it verbatim rather than
            rebuilding it from `script_url`. A hobby site's tag carries a
            `data-id` attribute as well: its script is a `/t/` bundle addressed by
            hash, and that attribute is the only place the counter inside it can
            read the site id. A tag for a paid site needs no attributes.
          examples:
            - "<script defer src=\"https://cdn.statable.com/js/3195799/s.js\"></script>"
            - "<script defer src=\"https://cdn.statable.com/js/07k1eD84d2/t/gw.js\" data-id=\"3195799\"></script>"

    BootstrapSendOTPRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: The address that will receive the code and own the account.
          examples: ["agent@yourcompany.com"]

    BootstrapSendOTPResponse:
      type: object
      required: [sent, email]
      properties:
        sent:
          type: boolean
          description: Always true. Says nothing about whether the account existed.
        email:
          type: string
          format: email
          description: The normalized (lower-cased, trimmed) address.

    BootstrapVerifyOTPRequest:
      type: object
      required: [email, code, accept_terms]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: >
            The code from the email. Single-use; three wrong guesses destroy it.
          examples: ["123456"]
        accept_terms:
          type: boolean
          description: >
            Must be true. Recorded server-side with the version, channel `api`,
            IP and User-Agent as the account's acceptance evidence.
        terms_version:
          type: string
          description: >
            The version being accepted. Defaults to the server's current version.
          examples: ["2026-07-01"]
        key_name:
          type: string
          maxLength: 100
          default: agent bootstrap
        scopes:
          type: array
          description: >
            Must be within `API_BOOTSTRAP_SCOPES` (default `read,sites:write`).
            Omitted = that whole set. `billing:write` is never available here.
          items:
            type: string
            enum: [read, sites:write, keys:manage, billing:write]
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90

    BootstrapVerifyOTPResponse:
      type: object
      required: [token, key, user, created]
      properties:
        token:
          type: string
          description: The raw bearer token, returned exactly once.
          examples: ["stbl_Z9y8X7w6…"]
        key:
          $ref: "#/components/schemas/APIKey"
        user:
          type: object
          required: [id, email]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
        created:
          type: boolean
          description: >
            True when this call registered a new account; false when the address
            already had one and simply received an additional key.

    APIKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/APIKey"

    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          description: >
            Defaults to ["read"]. Must be a subset of the authenticating key's
            scopes, else 403 scope_escalation.
          items:
            type: string
            enum: [read, "sites:write", "keys:manage", "billing:write"]
        website_id:
          type: [integer, "null"]
          format: int64
          description: >
            Lock the new key to one site. Omit/null = all of the owner's sites.
            A single-site key MUST pass its own site id here.
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
          description: Outside 1–365 → 400 invalid_expiry.

    CreatedAPIKey:
      description: >
        The created (or rotated) key plus its raw token. The token is returned
        exactly once and cannot be retrieved later.
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The raw bearer token. Store it now.
              examples: ["stbl_Z9y8X7w6…"]

    APIKeyEvent:
      type: object
      required: [event, created_at]
      properties:
        event:
          type: string
          enum: [created, rotated, revoked]
        ip:
          type: [string, "null"]
        user_agent:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        actor_key_id:
          type: [integer, "null"]
          format: int64
          description: The API key that performed the action; null = the dashboard.

    APIKeyEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/APIKeyEvent"

    FunnelStep:
      type: object
      description: >
        One step of a funnel definition. `kind` selects which other fields apply.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [page, event, goal, scroll, entry_page, exit_page]
        path:
          type: string
          description: URL path — for kind page/entry_page/exit_page.
        operator:
          type: string
          description: Path match operator (e|b|c|r) — for kind page.
        event:
          type: string
          description: Custom event name — for kind event.
        prop_key:
          type: string
          description: Optional custom-property key — for kind event.
        prop_value:
          type: string
          description: Optional custom-property value — for kind event.
        goal_id:
          type: integer
          format: int64
          description: Goal id — for kind goal.
        threshold:
          type: integer
          description: Scroll depth 0..100 — for kind scroll.

    FunnelDefinition:
      type: object
      description: A saved funnel definition (managed in the dashboard).
      properties:
        id: { type: integer, format: int64 }
        site_id: { type: integer, format: int64 }
        name: { type: string }
        scope:
          type: string
          enum: [visitor, session]
        strict_order:
          type: boolean
          description: When true, steps must occur in exact order (windowFunnel strict_order).
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FunnelStep"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FunnelReportRequest:
      type: object
      required: [date_range]
      properties:
        site_id:
          type: integer
          format: int64
          description: Optional for a single-site key; required for an all-sites key.
        date_range:
          $ref: "#/components/schemas/DateRange"
        filters:
          type: array
          description: >
            Segment/session filters only (country, browser, os, device, source,
            channel, referrer, utm_*, entry_page, exit_page, hostname). Event-level
            fields (event, page, code) return `invalid_filter`.
          items:
            $ref: "#/components/schemas/Filter"

    FunnelReportStep:
      type: object
      description: One step's outcome. Steps are ordered — do not sort them.
      properties:
        index:
          type: integer
          description: 0-based position in the funnel.
        name: { type: string }
        kind:
          type: string
          enum: [page, event, goal, scroll, entry_page, exit_page]
        visitors:
          type: integer
          format: int64
          description: Visitors/visits that reached this step.
        conversion_rate:
          type: number
          description: visitors / entering * 100 — cumulative vs the first step, NOT step-to-step.
        dropoff:
          type: integer
          format: int64
          description: Visitors lost versus the previous step.

    FunnelReportResponse:
      type: object
      properties:
        funnel:
          type: object
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            scope: { type: string, enum: [visitor, session] }
            strict_order: { type: boolean }
        entering:
          type: integer
          format: int64
          description: Visitors that reached step 0 — the funnel's denominator.
        all_visitors:
          type: integer
          format: int64
          description: Total visitors/visits in the period (funnel-independent).
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FunnelReportStep"
        query:
          type: object
          description: The resolved request (site_id, funnel_id, normalized date_range, filters).
